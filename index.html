<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Session Countdown</title>
<meta name="description" content="Full-screen countdown for conference talk slots: green, then yellow for the talk, red for questions.">
<meta name="theme-color" content="#1F5FA8" id="theme">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Countdown">
<style>
  :root {
    color-scheme: dark;
    --ready: #1F5FA8;
    --talk: #1D7646;
    --yellow: #F4C430;
    --red: #B4233A;
    --ink: #F6F7F3;
    --ink-soft: rgba(246, 247, 243, 0.80);
    --ink-faint: rgba(246, 247, 243, 0.55);
    --panel: rgba(8, 14, 22, 0.26);
    --field: rgba(255, 255, 255, 0.13);
    --hover: rgba(255, 255, 255, 0.22);
    --line: rgba(255, 255, 255, 0.30);
    --track: rgba(255, 255, 255, 0.22);
    --primary-hover: #FFFFFF;
    --face: ui-sans-serif, system-ui, -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --bg: var(--ready);
  }
  :root[data-phase="talk"] { --bg: var(--talk); }
  :root[data-phase="questions"], :root[data-phase="over"] { --bg: var(--red); }
  /* yellow is light: the digits and controls switch to dark ink */
  :root[data-phase="yellow"] {
    color-scheme: light;
    --bg: var(--yellow);
    --ink: #1B2430;
    --ink-soft: rgba(27, 36, 48, 0.80);
    --ink-faint: rgba(27, 36, 48, 0.60);
    --panel: rgba(27, 36, 48, 0.10);
    --field: rgba(255, 255, 255, 0.40);
    --hover: rgba(255, 255, 255, 0.65);
    --line: rgba(27, 36, 48, 0.35);
    --track: rgba(27, 36, 48, 0.20);
    --primary-hover: #000000;
  }

  [hidden] { display: none !important; }
  html { height: 100%; box-sizing: border-box; background: var(--bg); transition: background-color 0.6s ease; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--bg); color: var(--ink); font-family: var(--face);
    transition: background-color 0.6s ease;
  }

  .stage {
    height: 100%;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto auto auto;
    gap: clamp(8px, 1.6vh, 18px);
    /* clear of notches and system bars when running as an installed app */
    padding-top: calc(clamp(12px, 2.4vh, 32px) + env(safe-area-inset-top, 0px));
    padding-bottom: calc(clamp(12px, 2.4vh, 32px) + env(safe-area-inset-bottom, 0px));
    padding-left: max(clamp(16px, 3vw, 48px), env(safe-area-inset-left, 0px));
    padding-right: max(clamp(16px, 3vw, 48px), env(safe-area-inset-right, 0px));
  }

  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 24px; }
  .status { margin: 0; font-size: clamp(16px, 2.3vw, 28px); font-weight: 650; letter-spacing: 0.14em; text-transform: uppercase; }
  .meta { margin: 0; font-size: clamp(14px, 1.7vw, 21px); color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .face { position: relative; min-height: 0; overflow: hidden; }
  .clock {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: inline-block; white-space: nowrap;
    font-size: 100px; font-weight: 700; line-height: 1; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; transition: opacity 0.3s ease;
  }
  :root[data-paused="true"] .clock { opacity: 0.6; }
  :root[data-phase="over"]:not([data-paused="true"]) .clock { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }

  .track { position: relative; height: 10px; border-radius: 5px; background: var(--track); }
  .fill { position: absolute; inset: 0; border-radius: 5px; background: var(--ink); transform-origin: left center; transition: transform 0.1s linear; }
  .tick { position: absolute; top: -7px; width: 3px; height: 24px; margin-left: -1px; border-radius: 2px; background: var(--ink); }

  .controls {
    justify-self: center; max-width: 100%;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px;
    padding: 12px; border-radius: 14px; background: var(--panel);
    transition: opacity 0.4s ease;
  }
  .field { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--ink-soft); }
  .field input {
    width: 5.2ch; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--field); color: var(--ink);
    font: 650 20px/1.1 var(--face); font-variant-numeric: tabular-nums; text-align: right;
  }
  .field input:disabled { opacity: 0.5; }
  button {
    padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--field); color: var(--ink); font: 600 17px/1.1 var(--face); cursor: pointer;
  }
  button:hover { background: var(--hover); }
  button.primary { min-width: 7.5em; border-color: var(--ink); background: var(--ink); color: var(--bg); }
  button.primary:hover { background: var(--primary-hover); }
  button:focus-visible, .field input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .keys { margin: 0; text-align: center; font-size: 13px; color: var(--ink-faint); transition: opacity 0.4s ease; }
  @media (hover: none) { .keys { display: none; } }

  :root[data-idle="true"] .controls, :root[data-idle="true"] .keys { opacity: 0; pointer-events: none; }
  :root[data-idle="true"] body { cursor: none; }

  @media (prefers-reduced-motion: reduce) {
    html, body, .clock, .fill, .controls, .keys { transition: none; }
    :root[data-phase="over"]:not([data-paused="true"]) .clock { animation: none; }
  }
</style>

<main class="stage">
  <header class="top">
    <p class="status" id="status">Ready</p>
    <p class="meta" id="meta">25 min slot · 20 talk + 5 questions · yellow from 5:00</p>
  </header>
  <div class="face" id="face">
    <output class="clock" id="clock" role="timer" aria-label="Time left">25:00</output>
  </div>
  <div class="track" aria-hidden="true">
    <div class="fill" id="fill"></div>
    <div class="tick" id="tickY"></div>
    <div class="tick" id="tickQ"></div>
  </div>
  <form class="controls" id="controls" autocomplete="off">
    <label class="field" for="talk">Talk <input id="talk" type="number" min="0" max="600" step="any" value="20" inputmode="decimal"></label>
    <label class="field" for="questions">Questions <input id="questions" type="number" min="0" max="600" step="any" value="5" inputmode="decimal"></label>
    <label class="field" for="yellow">Yellow at <input id="yellow" type="number" min="0" max="600" step="any" value="5" inputmode="decimal"></label>
    <button type="button" id="minus" aria-label="Remove one minute">−1 min</button>
    <button type="button" id="plus" aria-label="Add one minute">+1 min</button>
    <button type="submit" id="go" class="primary">Start</button>
    <button type="button" id="reset">Reset</button>
    <button type="button" id="full">Full screen</button>
    <button type="button" id="install" hidden>Install app</button>
  </form>
  <p class="keys">Space start / pause · R reset · ↑ ↓ one minute more or less · F full screen</p>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const clock = $('clock'), face = $('face'), fill = $('fill'), tickY = $('tickY'), tickQ = $('tickQ');
  const statusEl = $('status'), meta = $('meta'), talkIn = $('talk'), qIn = $('questions'), yellowIn = $('yellow');
  const go = $('go'), fullBtn = $('full');
  const KEY = 'session-countdown-v2', MIN = 60000;

  // A slot is a talk (green, then yellow for its last minutes) followed by questions (red), then overtime.
  // Lengths in minutes; state 'ready' | 'running' | 'paused'; left = ms to the end of the slot.
  // endAt is wall-clock, so a reload keeps the clock running.
  let S = { talk: 20, q: 5, yellow: 5, state: 'ready', endAt: 0, left: 25 * MIN };
  try {
    const v = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (v && ['ready', 'running', 'paused'].includes(v.state) && [v.talk, v.q, v.yellow, v.endAt, v.left].every(Number.isFinite)) S = v;
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  talkIn.value = S.talk; qIn.value = S.q; yellowIn.value = S.yellow;

  const ms = m => Math.round(m * 60) * 1000;
  const total = () => ms(S.talk + S.q);
  const remaining = () => S.state === 'running' ? S.endAt - Date.now() : S.left;
  const num = (input, lo, hi, fallback) => {
    const x = parseFloat(String(input.value).replace(',', '.'));
    return Number.isFinite(x) ? Math.min(hi, Math.max(lo, x)) : fallback;
  };
  const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const mins = m => +m.toFixed(2);

  function fmt(t) {
    const over = t < 0;
    const s = over ? Math.floor(-t / 1000) : Math.ceil(t / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const txt = h ? h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0') : m + ':' + String(sec).padStart(2, '0');
    return (over && s > 0 ? '+' : '') + txt;
  }

  // phase and the number on the clock: the whole slot when ready, the talk time during the talk,
  // the questions time during questions, the overtime after
  function view(r) {
    if (S.state === 'ready') return ['ready', fmt(total())];
    const q = ms(S.q);
    if (r > q) return [r - q > ms(S.yellow) ? 'talk' : 'yellow', fmt(r - q)];
    if (r > 0) return ['questions', fmt(r)];
    return ['over', fmt(r)];
  }

  function fit() {
    const box = face.getBoundingClientRect();
    clock.style.fontSize = '100px';
    const w = clock.offsetWidth || 1, h = clock.offsetHeight || 100;
    const fs = Math.max(24, Math.min(box.width * 0.96 * 100 / w, box.height * 0.92 * 100 / h));
    clock.style.fontSize = fs.toFixed(1) + 'px';
  }

  // the browser bar and the phone's status bar take the phase color too
  const THEME = { ready: '#1F5FA8', talk: '#1D7646', yellow: '#F4C430', questions: '#B4233A', over: '#B4233A' };
  const themeMeta = $('theme');

  let lastText = '', lastLen = 0, lastPhase = '';
  function render() {
    const r = remaining(), [p, t] = view(r);
    root.dataset.phase = p;
    if (p !== lastPhase) { lastPhase = p; themeMeta.setAttribute('content', THEME[p]); }
    root.dataset.paused = String(S.state === 'paused');
    if (t !== lastText) {
      clock.textContent = t; lastText = t;
      if (t.length !== lastLen) { lastLen = t.length; fit(); }
      document.title = S.state === 'ready' ? 'Session Countdown' : t + ' · Session Countdown';
    }
    const T = total();
    fill.style.transform = 'scaleX(' + (T > 0 ? Math.min(1, Math.max(0, r / T)) : 0).toFixed(4) + ')';
    const fq = T > 0 ? ms(S.q) / T : 0, fy = T > 0 ? ms(S.q + Math.min(S.yellow, S.talk)) / T : 0;
    tickQ.hidden = !(fq > 0 && fq < 1);
    tickQ.style.left = (fq * 100).toFixed(3) + '%';
    tickY.hidden = !(S.yellow > 0 && fy > fq && fy < 1);
    tickY.style.left = (fy * 100).toFixed(3) + '%';
    const lastTalk = Number.isInteger(S.yellow) ? S.yellow + (S.yellow === 1 ? ' minute' : ' minutes') : mmss(Math.round(S.yellow * 60));
    statusEl.textContent = S.state === 'paused' ? 'Paused'
      : { ready: 'Ready', talk: 'Talk', yellow: 'Talk · last ' + lastTalk, questions: 'Questions', over: 'Time is up' }[p];
    meta.textContent = mins(S.talk + S.q) + ' min slot · ' + mins(S.talk) + ' talk + ' + mins(S.q) + ' questions · '
      + (S.yellow > 0 ? 'yellow from ' + mmss(Math.round(S.yellow * 60)) : 'no yellow');
    go.textContent = S.state === 'running' ? 'Pause' : S.state === 'paused' ? 'Resume' : 'Start';
    for (const el of [talkIn, qIn]) {
      el.disabled = S.state !== 'ready';
      el.title = S.state === 'ready' ? '' : 'Reset to change the slot';
    }
  }

  // screen stays awake while the clock runs, where the browser allows it
  let wake = null;
  async function lock() {
    try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
  }
  function unlock() { try { if (wake) wake.release(); } catch (e) {} wake = null; }

  function readInputs() {
    S.talk = num(talkIn, 0, 600, S.talk);
    S.q = num(qIn, 0, 600, S.q);
    S.yellow = num(yellowIn, 0, 600, S.yellow);
    if (S.talk + S.q <= 0) S.talk = 1;
  }
  function start() {
    if (S.state === 'running') return;
    if (S.state === 'ready') { readInputs(); S.left = total(); }
    S.endAt = Date.now() + S.left; S.state = 'running';
    save(); lock(); render(); poke();
  }
  function pause() {
    if (S.state !== 'running') return;
    S.left = S.endAt - Date.now(); S.state = 'paused';
    save(); unlock(); render(); poke();
  }
  const toggle = () => (S.state === 'running' ? pause() : start());
  function reset() {
    readInputs();
    S.state = 'ready'; S.left = total();
    save(); unlock(); render(); poke();
  }
  // one minute more or less: before starting it changes the talk; during the talk it lengthens or
  // shortens the talk; during questions or overtime it changes the questions
  function adjust(dm) {
    if (S.state === 'ready') {
      S.talk = Math.min(600, Math.max(0, Math.round(S.talk) + dm));
      if (S.talk + S.q <= 0) S.talk = 1;
      talkIn.value = S.talk; S.left = total();
    } else {
      const inTalk = remaining() > ms(S.q);
      if (inTalk) S.talk = Math.max(0, S.talk + dm); else S.q = Math.max(0, S.q + dm);
      if (S.state === 'running') S.endAt += dm * MIN; else S.left += dm * MIN;
      // the fields keep the planned slot, so Reset prepares the next talk without this extra time
    }
    save(); render(); poke();
  }

  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const canFull = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  fullBtn.hidden = !canFull;
  async function full() {
    try {
      if (fsEl()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else await (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    } catch (e) { meta.textContent = 'This browser blocked full screen here; use its own full-screen command.'; }
  }
  const onFull = () => { fullBtn.textContent = fsEl() ? 'Exit full screen' : 'Full screen'; requestAnimationFrame(fit); };
  document.addEventListener('fullscreenchange', onFull);
  document.addEventListener('webkitfullscreenchange', onFull);

  // controls fade out 3 s after the last pointer or key activity while the clock runs
  let idleTimer = 0;
  function poke() {
    root.dataset.idle = 'false';
    clearTimeout(idleTimer);
    if (S.state === 'running') idleTimer = setTimeout(() => {
      if (S.state === 'running' && !document.activeElement.matches('input')) root.dataset.idle = 'true';
    }, 3000);
  }
  ['pointermove', 'pointerdown', 'touchstart'].forEach(ev => addEventListener(ev, poke, { passive: true }));
  // a mouse click leaves no focus behind, so Space and the other keys keep driving the clock
  document.querySelectorAll('.controls button').forEach(btn => btn.addEventListener('click', e => { if (e.detail > 0) btn.blur(); }));

  $('controls').addEventListener('submit', e => { e.preventDefault(); toggle(); });
  $('reset').addEventListener('click', reset);
  $('plus').addEventListener('click', () => adjust(1));
  $('minus').addEventListener('click', () => adjust(-1));
  fullBtn.addEventListener('click', full);
  for (const [el, key] of [[talkIn, 'talk'], [qIn, 'q']]) {
    el.addEventListener('input', () => {
      if (S.state !== 'ready') return;
      const v = num(el, 0, 600, NaN);
      if (Number.isFinite(v)) { S[key] = v; S.left = total(); save(); render(); }
    });
    el.addEventListener('change', () => { if (S.state === 'ready') el.value = mins(S[key]); });
  }
  yellowIn.addEventListener('input', () => {
    const v = num(yellowIn, 0, 600, NaN);
    if (Number.isFinite(v)) { S.yellow = v; save(); render(); }
  });
  yellowIn.addEventListener('change', () => { yellowIn.value = mins(S.yellow); });

  addEventListener('keydown', e => {
    poke();
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t.matches && t.matches('input')) { if (e.key === 'Escape') t.blur(); return; }
    if (t.matches && t.matches('button') && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    else if (e.key === 'r' || e.key === 'R') reset();
    else if (e.key === 'f' || e.key === 'F') full();
    else if (e.key === 'ArrowUp') { e.preventDefault(); adjust(1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); adjust(-1); }
  });

  addEventListener('resize', fit);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { if (S.state === 'running') lock(); render(); }
  });

  // installing: Chrome and Edge offer it through this button; Safari through Share › Add to Home Screen
  let installPrompt = null;
  const installBtn = $('install');
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; installBtn.hidden = false; });
  installBtn.addEventListener('click', async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    try { await installPrompt.userChoice; } catch (e) {}
    installPrompt = null; installBtn.hidden = true;
  });
  addEventListener('appinstalled', () => { installPrompt = null; installBtn.hidden = true; });

  // offline support when served from a web address; opened as a file it simply runs without it
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }

  if (S.state === 'ready') S.left = total();
  render(); fit();
  if (S.state === 'running') { lock(); poke(); }
  setInterval(render, 100);
})();
</script>
